name: Compilar APK Agente Quantico v6.0
​on:
push:
branches: [ main ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Baixar o codigo fonte
uses: actions/checkout@v4
​- name: Configurar Java SDK
uses: actions/setup-java@v5
with:
distribution: 'zulu'
java-version: '17'
​- name: Configurar Flutter SDK
uses: subosito/flutter-action@v2
with:
flutter-version: '3.24.0'
channel: 'stable'
​- name: Limpar e Recriar Estrutura Android
run: |
rm -rf android
flutter create --platforms android --project-name agente_ia .
​- name: Descarregar Pacotes e Dependencias
run: flutter pub get
​- name: Compilar APK Otimizado (Release)
run: flutter build apk --release --split-per-abi
​- name: Disponibilizar APK como Artefato
uses: actions/upload-artifact@v4
with:
name: Agente-Quantico-v6-APK
path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
