name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Limpar estrutura antiga e recriar limpa
        run: |
          rm -rf android/
          rm -rf ios/
          rm -rf macos/
          rm -rf linux/
          rm -rf windows/
          rm -rf web/
          flutter create . --platforms=android --org com.agenteia.app

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Quantico-APK
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
