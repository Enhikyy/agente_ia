name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Limpar estrutura antiga e recriar limpa
        run: |
          rm -rf android/
          rm -rf ios/
          rm -rf macos/
          rm -rf linux/
          rm -rf windows/
          rm -rf web/
          flutter create . --platforms=android --org com.agenteia.app

      - name: Align Android toolchain versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 34/' android/app/build.gradle

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/*.apk
          sha256sum build/app/outputs/flutter-apk/*.apk | tee build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish direct APK download (no ZIP)
        if: github.ref == 'refs/heads/feature/nova-functional-dashboard'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nova-preview >/dev/null 2>&1 || gh release create nova-preview --prerelease --title 'NOVA Android — versão de testes' --notes 'Build experimental. Instale somente o APK, sem extrair ZIP. A instalação no aparelho ainda precisa ser validada.' --target "$GITHUB_SHA"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NOVA-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/NOVA-moto-g62-arm64.apk
          gh release upload nova-preview build/app/outputs/flutter-apk/NOVA-universal.apk build/app/outputs/flutter-apk/NOVA-moto-g62-arm64.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --clobber
