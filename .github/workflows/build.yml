name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Limpar estrutura antiga e recriar limpa
        run: |
          rm -rf android/
          rm -rf ios/
          rm -rf macos/
          rm -rf linux/
          rm -rf windows/
          rm -rf web/
          flutter create . --platforms=android --org com.agenteia.app

      - name: Install Android resource monitoring bridge
        run: |
          activity=$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit)
          test -n "$activity"
          cp tooling/NovaMainActivity.kt "$activity"
          cp tooling/NovaBackgroundWorker.kt "$(dirname "$activity")/NovaBackgroundWorker.kt"
          printf '\n%s\n' 'dependencies {' '    implementation "androidx.work:work-runtime-ktx:2.9.1"' '}' >> android/app/build.gradle
          grep -F 'androidx.work:work-runtime-ktx:2.9.1' android/app/build.gradle

      - name: Brand Android launcher as NOVA
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64, io, pathlib, xml.etree.ElementTree as ET
          from PIL import Image, ImageOps
          root = pathlib.Path('android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          app = tree.getroot().find('application')
          android = '{http://schemas.android.com/apk/res/android}'
          permission = ET.Element('uses-permission')
          permission.set(android + 'name', 'android.permission.INTERNET')
          tree.getroot().insert(0, permission)
          app.set(android + 'label', 'NOVA')
          app.set(android + 'icon', '@mipmap/ic_launcher')
          metadata = next((item for item in app.findall('meta-data')
              if item.get(android + 'name') == 'flutterEmbedding'), None)
          if metadata is None:
              metadata = ET.SubElement(app, 'meta-data')
              metadata.set(android + 'name', 'flutterEmbedding')
          metadata.set(android + 'value', '2')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          source = pathlib.Path('assets/branding/nova_icon.jpg.base64').read_text().strip()
          icon = Image.open(io.BytesIO(base64.b64decode(source))).convert('RGB')
          for density, pixels in [('mdpi',48),('hdpi',72),('xhdpi',96),
                                  ('xxhdpi',144),('xxxhdpi',192)]:
              folder = root / 'res' / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              ImageOps.fit(icon, (pixels,pixels), method=Image.Resampling.LANCZOS).save(folder/'ic_launcher.png')
          foreground = Image.new('RGBA',(432,432),(0,0,0,0))
          art = ImageOps.fit(icon,(288,288),method=Image.Resampling.LANCZOS)
          foreground.paste(art,(72,72))
          drawable = root/'res/drawable-nodpi'
          drawable.mkdir(parents=True,exist_ok=True)
          foreground.save(drawable/'nova_icon_foreground.png')
          colors = root/'res/values'
          colors.mkdir(parents=True,exist_ok=True)
          (colors/'nova_colors.xml').write_text(
              '<resources><color name="nova_icon_bg">#0D3A2C</color></resources>')
          adaptive = root/'res/mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          (adaptive/'ic_launcher.xml').write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/nova_icon_bg"/>'
              '<foreground android:drawable="@drawable/nova_icon_foreground"/>'
              '</adaptive-icon>')
          print('Verified NOVA launcher icon, label and adaptive icon resources.')
          print(manifest.read_text())
          PY

      - name: Align Android toolchain versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 34/' android/app/build.gradle

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Configure permanent release signing
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -z "$NOVA_KEYSTORE_B64" ] || [ -z "$NOVA_STORE_PASSWORD" ] || [ -z "$NOVA_KEY_ALIAS" ] || [ -z "$NOVA_KEY_PASSWORD" ]; then
            echo "No permanent signing key configured: APK is CI-only; publishing disabled."
            echo "NOVA_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$NOVA_KEYSTORE_B64" | base64 -d > android/app/nova-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          needle = '    buildTypes {'
          assert needle in s, 'Flutter Gradle template changed'
          signing = """    signingConfigs {
              novaRelease {
                  storeFile file("nova-release.jks")
                  storePassword System.getenv("NOVA_STORE_PASSWORD")
                  keyAlias System.getenv("NOVA_KEY_ALIAS")
                  keyPassword System.getenv("NOVA_KEY_PASSWORD")
              }
          }
          """
          s = s.replace(needle, signing + needle, 1)
          assert 'signingConfig signingConfigs.debug' in s, 'Unexpected release signing template'
          s = s.replace('signingConfig signingConfigs.debug',
                        'signingConfig signingConfigs.novaRelease', 1)
          p.write_text(s)
          PY
          echo "NOVA_SIGNED=true" >> "$GITHUB_ENV"

      - name: Get Dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release --build-number ${{ github.run_number }} --dart-define=NOVA_BUILD_NUMBER=${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-number ${{ github.run_number }} --dart-define=NOVA_BUILD_NUMBER=${{ github.run_number }}
          ls -lh build/app/outputs/flutter-apk/*.apk
          sha256sum build/app/outputs/flutter-apk/*.apk | tee build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish direct APK download (no ZIP)
        if: github.ref == 'refs/heads/feature/nova-external-packs' && env.NOVA_SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nova-preview >/dev/null 2>&1 || gh release create nova-preview --prerelease --title 'NOVA Android — versão de testes' --notes 'Build experimental.' --target "$GITHUB_SHA"
          gh release edit nova-preview --notes "NOVA_BUILD_NUMBER=${{ github.run_number }}\nAtualização de testes; confirme a instalação no Android."
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NOVA-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/NOVA-moto-g62-arm64.apk
          gh release upload nova-preview build/app/outputs/flutter-apk/NOVA-universal.apk build/app/outputs/flutter-apk/NOVA-moto-g62-arm64.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --clobber
