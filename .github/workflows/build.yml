name: Gerar APK Responsivo Definitivo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v4
    
    - name: Configurar Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Criar Estrutura Android
      run: |
        flutter create --platforms android --project-name agente_ia .
        
    - name: Baixar Pacotes
      run: flutter pub get
        
    - name: Compilar APK Otimizado
      run: flutter build apk --release --split-per-abi

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Agente-Responsivo-APK
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
