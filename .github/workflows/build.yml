name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Limpar estrutura antiga e recriar limpa
        run: |
          rm -rf android/
          rm -rf ios/
          rm -rf macos/
          rm -rf linux/
          rm -rf windows/
          rm -rf web/
          flutter create . --platforms=android --org com.agenteia.app

      - name: Align Android toolchain versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 34/' android/app/build.gradle

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Quantico-APK
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
