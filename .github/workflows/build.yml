name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Regenerar Estrutura Nativa Compatível
        run: flutter create . --platforms=android

      - name: Forçar compileSdk 35 no build.gradle
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle

      - name: Atualizar versão do Kotlin no settings.gradle
        run: |
          if grep -q 'id "org.jetbrains.kotlin.android"' android/settings.gradle; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          else
            echo "Kotlin version not found in settings.gradle, trying build.gradle"
          fi

      - name: Atualizar versão do Kotlin no build.gradle (Fallback)
        run: |
          if grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Quantico-APK
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
